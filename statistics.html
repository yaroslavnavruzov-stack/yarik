<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Статистика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark"><i class="bi bi-buildings-fill"></i></span><span class="logo-text">ГосОбращения</span></a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-i18n="nav.dashboard">Дашборд</a>
        <a href="applications.html" class="nav-link" data-i18n="nav.applications">Обращения</a>
        <a href="create.html" class="nav-link" data-i18n="nav.create">Подать</a>
        <a href="statistics.html" class="nav-link active" data-i18n="nav.statistics">Статистика</a>
        <a href="departments.html" class="nav-link" data-i18n="nav.departments">Отделы</a>
      </nav>
      <div class="header-tools">
        <select class="lang-select" id="langSelect"><option value="ru">Русский</option><option value="ky">Кыргызча</option><option value="en">English</option></select>
        <button class="theme-toggle" id="themeToggle"><i class="bi bi-moon-stars-fill"></i></button>
        <button class="theme-toggle" id="logoutBtn"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </header>
  <main class="container main-content">
    <section class="page-title-block"><h1 class="page-title" data-i18n="stats.title">Статистика</h1></section>
    <section class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value" id="kpiTotal">0</div><div class="kpi-label" data-i18n="stats.kpi_total">Всего</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiResolvedPercent">0%</div><div class="kpi-label" data-i18n="stats.kpi_resolved">Решено</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiAvgTime">0</div><div class="kpi-label" data-i18n="stats.kpi_avg">Среднее</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpiToday">0</div><div class="kpi-label" data-i18n="stats.kpi_today">Сегодня</div></div>
    </section>
    <div class="charts-grid">
      <section class="card chart-card"><h3 class="chart-title"><i class="bi bi-pie-chart-fill"></i><span data-i18n="stats.by_category">По категориям</span></h3><div id="categoryChart" class="bar-chart"></div></section>
      <section class="card chart-card"><h3 class="chart-title"><i class="bi bi-bar-chart-fill"></i><span data-i18n="stats.by_status">По статусам</span></h3><div id="statusChart" class="bar-chart"></div></section>
    </div>
    <section class="card"><h3 class="chart-title"><i class="bi bi-graph-up-arrow"></i><span data-i18n="stats.week">Активность</span></h3><div id="weekChart" class="line-bars"></div></section>
  </main>
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script type="module" src="js/statistics.js">
    import { login, register } from './js/auth.js';
  </script>
</body>
</html>
