<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подать обращение</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark"><i class="bi bi-buildings-fill"></i></span><span class="logo-text">ГосОбращения</span></a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-i18n="nav.dashboard">Дашборд</a>
        <a href="applications.html" class="nav-link" data-i18n="nav.applications">Обращения</a>
        <a href="create.html" class="nav-link active" data-i18n="nav.create">Подать</a>
        <a href="statistics.html" class="nav-link" data-i18n="nav.statistics">Статистика</a>
        <a href="departments.html" class="nav-link" data-i18n="nav.departments">Отделы</a>
      </nav>
      <div class="header-tools">
        <select class="lang-select" id="langSelect"><option value="ru">Русский</option><option value="ky">Кыргызча</option><option value="en">English</option></select>
        <button class="theme-toggle" id="themeToggle"><i class="bi bi-moon-stars-fill"></i></button>
        <button class="theme-toggle" id="logoutBtn" title="Выйти"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </header>
  
  <main class="container main-content">
    <section class="page-title-block"><h1 class="page-title" data-i18n="create.title">Подать обращение</h1></section>
    
    <div class="form-layout">
      <form id="appealForm" class="card form-card" novalidate>
        <div class="form-row">
          <div class="form-group"><label data-i18n="create.fullName">ФИО *</label><input type="text" id="fullName" class="form-control"><span class="error-text" data-error-for="fullName"></span></div>
          <div class="form-group"><label data-i18n="create.email">Email *</label><input type="email" id="email" class="form-control"><span class="error-text" data-error-for="email"></span></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label data-i18n="create.phone">Телефон</label><input type="tel" id="phone" class="form-control"><span class="error-text" data-error-for="phone"></span></div>
          <div class="form-group"><label data-i18n="create.category">Категория *</label><select id="category" class="form-control"></select><span class="error-text" data-error-for="category"></span></div>
        </div>
        <div class="form-group"><label data-i18n="create.department">Отдел *</label><select id="departmentId" class="form-control"></select><span class="error-text" data-error-for="departmentId"></span></div>
        <div class="form-group"><label data-i18n="create.subject">Тема *</label><input type="text" id="subject" class="form-control"><span class="error-text" data-error-for="subject"></span></div>
        <div class="form-group"><label data-i18n="create.description">Описание *</label><textarea id="description" class="form-control" rows="6"></textarea><span class="error-text" data-error-for="description"></span></div>
        <div class="form-group form-check"><label class="checkbox-label"><input type="checkbox" id="agree"><span data-i18n="create.agree">Согласен *</span></label><span class="error-text" data-error-for="agree"></span></div>
        <div class="form-actions">
          <a href="index.html" class="btn btn-ghost" data-i18n="common.cancel">Отмена</a>
          <button type="submit" class="btn btn-primary" data-i18n="create.submit">Отправить</button>
        </div>
      </form>
      
      <aside class="card info-card">
        <h3 class="info-title"><i class="bi bi-info-circle-fill"></i><span data-i18n="create.info_title">Порядок</span></h3>
        <ol class="info-list">
          <li data-i18n="create.info_1"></li>
          <li data-i18n="create.info_2"></li>
          <li data-i18n="create.info_3"></li>
          <li data-i18n="create.info_4"></li>
        </ol>
      </aside>
    </div>
  </main>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2025 ГосОбращения</p>
      <p>support@gos-appeals.ru</p>
    </div>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/i18n.js"></script>
  <script type="module" src="js/create.js"></script>
</body>
</html>
